<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Algorithm Visualizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Bubble Sort Visualizer</h1>
  </header>

  <main>
    <!-- Controls Section -->
    <div class="controls">
      <button id="generate-btn">Generate New Array</button>
      <button id="start-btn">Start Sorting</button>
      
      <div class="control-group">
        <label for="speed-slider">Speed:</label>
        <input type="range" id="speed-slider" min="10" max="500" value="100">
      </div>

      <div class="control-group">
        <label for="size-slider">Array Size:</label>
        <input type="range" id="size-slider" min="5" max="30" value="15">
      </div>
    </div>

    <!-- Visualization Container -->
    <div id="array-container"></div>
  </main>

  <!-- Script File Linked -->
  <script src="script.js"></script>
</body>
</html>
